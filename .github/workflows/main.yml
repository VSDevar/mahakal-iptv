name: Update Mahakal M3U

on:
  schedule:
    # Runs automatically every single day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Keeps the manual button active just in case you want to test it

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: |
          python update.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          touch mahakal.m3u
          git add mahakal.m3u
          git commit -m "Scheduled daily automation sync for OTT Navigator" || exit 0
          git push
