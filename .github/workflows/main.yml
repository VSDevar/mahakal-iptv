name: Update Mahakal M3U

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch: 

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the workflow permission to overwrite and push files
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: python update.py

      - name: Force Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add --all
          git commit -m "Automated URL structural fix" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref }}
