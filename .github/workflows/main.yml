name: Update Mahakal M3U

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install yt-dlp
        run: pip install -U yt-dlp

      - name: Run Python M3U Generator
        run: python update.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Automated Ujjain Mahakal Live link synchronization" || echo "No files modified"
          git push
