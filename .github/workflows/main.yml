name: Update Mahakal M3U

on:
  schedule:
    # 6:30 PM UTC converts exactly to 12:00 Midnight IST
    - cron: '30 18 * * *'
  workflow_dispatch: 

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Forces GitHub to allow overwrites to file structure data
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper Script
        run: python update.py

      - name: Force Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add --all
          git commit -m "Automated daily Ujjain Mahakal Live link synchronization" || echo "No files modified"
          git push origin HEAD:${{ github.ref }}
