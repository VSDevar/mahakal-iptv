name: Update Mahakal M3U

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install yt-dlp

      - name: Run Scraper Script with Cookies
        env:
          COOKIE_RAW_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          # Write the secret text into a temporary file for yt-dlp to read
          echo "$COOKIE_RAW_DATA" > youtube_cookies.txt
          python update.py
          # Clean up the secret file immediately
          rm -f youtube_cookies.txt

      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          touch mahakal.m3u
          git add mahakal.m3u
          git commit -m "Auto-updated Mahakal YouTube Live via Cookies" || exit 0
          git push
