name: Update Mahakal M3U

on:
  schedule:
    # Runs every 4 hours so stream tokens stay fresh
    - cron: '0 */4 * * *'
  workflow_dispatch: # Allows manual testing anytime

jobs:
  update-list:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install yt-dlp
        run: |
          sudo curl -L https://github.com -o /usr/local/bin/yt-dlp
          sudo chmod a+rx /usr/local/bin/yt-dlp

      - name: Run Python M3U Generator
        run: |
          PY_FILE=$(find . -maxdepth 2 -name "*.py" | head -n 1)
          if [ -z "$PY_FILE" ]; then
            echo "No Python (.py) file found in the repository!"
            exit 1
          fi
          echo "Running $PY_FILE..."
          python "$PY_FILE"

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@://github.com"
          git config --local user.name "github-actions[bot]"
          git add -A
          git commit -m "Automated Ujjain Mahakal Live link synchronization" || echo "No files modified"
          git push
