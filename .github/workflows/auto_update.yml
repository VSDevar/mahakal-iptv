name: Update Mahakal M3U

on:
  schedule:
    # Runs every 6 hours to refresh tokens. Adjust as needed.
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows you to run it manually by clicking "Run workflow"

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Run Scraper Script
        env:
          # Add your Netscape cookie text or cookie string into GitHub Secrets as MAHAKAL_COOKIES
          COOKIE_DATA: ${{ secrets.MAHAKAL_COOKIES }}
        run: |
          python update.py
      - name: Commit and Push Changes
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          # Ensures the file exists so git add never throws a fatal pathspec error
          touch mahakal.m3u 
          git add mahakal.m3u
          git commit -m "Auto-updated Ujjain Mahakal Live stream for OTT Navigator" || exit 0
          git push

    
