name: Update Mahakal M3U Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch: 

jobs:
  update-list:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        # Pulls the absolute freshest daily patch of yt-dlp to stay ahead of bot errors
        pip install --no-cache-dir --upgrade https://github.com

    - name: Run Update Script
      run: python update_playlist.py

    - name: Commit and Push M3U File
      run: |
        git config --global user.name "GitHub Action"
        git config --global user.email "actions@github.com"
        git add mahakal.m3u
        git diff --quiet && git diff --staged --quiet || (git commit -m "OTT Navigator playlist updated" && git push)
